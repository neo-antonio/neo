<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar · neo</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="neo">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="shell.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</head>
<body>
<main id="app"></main>
<script>
const N=Neo,root=document.getElementById('app');let E=[],y=new Date().getFullYear(),m=new Date().getMonth(),sel=N.today();
const cfg={tab:'Events',noun:'event',fields:[{k:'date',l:'Date',t:'date',req:1},{k:'time',l:'Time',t:'time'},{k:'title',l:'Title',req:1},{k:'notes',l:'Notes',t:'textarea'}]};
function draw(){const first=new Date(y,m,1),pad=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),ym=y+'-'+String(m+1).padStart(2,'0');
 let cells='';for(let i=0;i<pad;i++)cells+='<span></span>';
 for(let d=1;d<=dim;d++){const k=ym+'-'+String(d).padStart(2,'0');cells+='<button data-k="'+k+'" class="'+[k===N.today()?'today':'',k===sel?'sel':'',E.some(e=>e.date===k)?'has':''].join(' ')+'">'+d+'</button>'}
 const ev=E.filter(e=>e.date===sel).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 root.innerHTML='<div class="bar"><h1>'+first.toLocaleString('en',{month:'long',year:'numeric'})+'</h1><div class="acts"><button class="ghost sm" id="pv" aria-label="Previous month">‹</button><button class="ghost sm" id="nx" aria-label="Next month">›</button></div></div>'
 +'<div class="cal">'+'MTWTFSS'.split('').map(c=>'<b>'+c+'</b>').join('')+cells+'</div>'
 +'<div class="bar" style="margin-top:20px"><h3>'+sel+'</h3><button class="go sm" id="add">+ Event</button></div><div class="list">'+(ev.length?ev.map(e=>'<div class="it" data-id="'+e.id+'"><div class="it-b"><b>'+N.esc(e.title)+'</b>'+(e.notes?'<small>'+N.esc(e.notes)+'</small>':'')+'</div><span class="it-r">'+N.esc(e.time)+'</span></div>').join(''):'<p class="mut">No events.</p>')+'</div>';
 document.getElementById('pv').onclick=()=>{m--;if(m<0){m=11;y--}draw()};document.getElementById('nx').onclick=()=>{m++;if(m>11){m=0;y++}draw()};
 document.getElementById('add').onclick=()=>N.form(cfg,{date:sel},load)}
root.addEventListener('click',e=>{const b=e.target.closest('[data-k]'),it=e.target.closest('.it');if(b){sel=b.dataset.k;draw()}else if(it)N.form(cfg,E.find(x=>x.id===it.dataset.id),load)});
function load(){N.list('Events').then(r=>{E=r;draw()}).catch(e=>root.innerHTML='<p class="err">'+N.esc(e.message)+'</p>')}
const c=N.cached('Events');if(c){E=c;draw()}load();
</script>
</body>
</html>
