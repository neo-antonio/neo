<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Log · neo</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="neo">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="shell.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</head>
<body>
<main id="app"></main>
<script>
Neo.collection({tab:'DailyLog',title:'Daily Log',noun:'entry',fields:[
 {k:'date',l:'Date',t:'date',def:'today',req:1},{k:'meal',l:'Meal',t:'select',opt:['Breakfast','Lunch','Dinner','Snack']},{k:'food',l:'Food / note'},
 {k:'calories',l:'Calories',t:'number'},{k:'protein',l:'Protein (g)',t:'number'},{k:'carbs',l:'Carbs (g)',t:'number'},{k:'fat',l:'Fat (g)',t:'number'},
 {k:'water',l:'Water (glasses)',t:'number'},{k:'weightKg',l:'Weight (kg)',t:'number'},{k:'notes',l:'Notes',t:'textarea'}],
 sort:(a,b)=>b.date.localeCompare(a.date),
 group:r=>r.date===Neo.today()?'Today':r.date,
 head:rows=>{const t=rows.filter(r=>r.date===Neo.today()),s=k=>t.reduce((a,r)=>a+Neo.num(r[k]),0);return '<div class="cards"><div class="card"><span class="l">Calories today</span><span class="n">'+s('calories')+'</span></div><div class="card"><span class="l">Protein</span><span class="n">'+s('protein')+'g</span></div><div class="card"><span class="l">Water</span><span class="n">'+s('water')+'</span></div><div class="card"><span class="l">Entries</span><span class="n">'+t.length+'</span></div></div>'},
 row:r=>[r.food||r.meal||'Entry',[r.meal,r.protein&&r.protein+'g P',r.weightKg&&r.weightKg+' kg'].filter(Boolean).join(' · '),r.calories?r.calories+' kcal':'']});
</script>
</body>
</html>
