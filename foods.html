<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Library · neo</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="neo">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="shell.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</head>
<body>
<main id="app"></main>
<script>
Neo.collection({tab:'Foods',title:'Food Library',noun:'food',fields:[
 {k:'name',l:'Food',req:1},{k:'serving',l:'Serving (e.g. 1 cup)'},{k:'calories',l:'Calories',t:'number'},
 {k:'protein',l:'Protein (g)',t:'number'},{k:'carbs',l:'Carbs (g)',t:'number'},{k:'fat',l:'Fat (g)',t:'number'}],
 sort:(a,b)=>a.name.localeCompare(b.name),
 row:r=>[r.name,[r.serving,r.protein&&r.protein+'P',r.carbs&&r.carbs+'C',r.fat&&r.fat+'F'].filter(Boolean).join(' · '),r.calories?r.calories+' kcal':'']});
</script>
</body>
</html>
