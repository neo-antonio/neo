<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Planner · neo</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="neo">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="shell.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</head>
<body>
<main id="app"></main>
<script>
const N=Neo,root=document.getElementById('app');let H=[],L=[];
const cfg={tab:'Habits',noun:'habit',fields:[{k:'name',l:'Habit',req:1},{k:'note',l:'Note'}]};
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
const has=(h,k)=>L.find(x=>x.habit===h.id&&x.date===k);
function streak(h){let n=0;const d=new Date();for(;;){const k=N.ymd(d);if(has(h,k))n++;else if(n||k!==N.today())break;d.setDate(d.getDate()-1)}return n}
function draw(){root.innerHTML='<div class="bar"><h1>Habit Planner</h1><button class="go sm" id="add">+ Add</button></div>'+(H.length?H.map(h=>'<div class="panel"><div class="bar" style="margin:0 0 10px"><b data-e="'+h.id+'" style="cursor:pointer">'+N.esc(h.name)+'</b><small>'+streak(h)+' day streak</small></div><div class="hb">'+days.map(d=>{const k=N.ymd(d);return '<button class="tg'+(has(h,k)?' on':'')+'" data-h="'+h.id+'" data-d="'+k+'" aria-label="'+k+'"><span>'+(has(h,k)?'':'MTWTFSS'[(d.getDay()+6)%7])+'</span></button>'}).join('')+'</div></div>').join(''):'<p class="mut">No habits yet. Tap + Add.</p>');
 document.getElementById('add').onclick=()=>N.form(cfg,null,load)}
root.addEventListener('click',async e=>{const b=e.target.closest('[data-h]'),n=e.target.closest('[data-e]');
 if(n)return N.form(cfg,H.find(h=>h.id===n.dataset.e),load);if(!b)return;
 const h=H.find(x=>x.id===b.dataset.h),ex=has(h,b.dataset.d);
 try{if(ex){L=L.filter(x=>x!==ex);draw();await N.del('HabitLog',ex.id)}else{const r={habit:h.id,date:b.dataset.d};L.push(r);draw();Object.assign(r,await N.save('HabitLog',r))}}catch(x){N.toast(x.message);load()}});
function load(){N.many(['Habits','HabitLog']).then(d=>{H=d.Habits;L=d.HabitLog;draw()}).catch(e=>root.innerHTML='<p class="err">'+N.esc(e.message)+'</p>')}
load();
</script>
</body>
</html>
