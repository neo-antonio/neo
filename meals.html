<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Planning · neo</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="neo">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="shell.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</head>
<body>
<main id="app"></main>
<script>
Neo.collection({tab:'Meals',title:'Meal Planning',noun:'planned meal',also:['Foods'],fields:[
 {k:'date',l:'Date',t:'date',def:'today',req:1},{k:'slot',l:'Meal',t:'select',opt:['Breakfast','Lunch','Dinner','Snack']},
 {k:'food',l:'Food',req:1,ph:'Type, or copy a name from your Food Library'},{k:'notes',l:'Notes'}],
 sort:(a,b)=>a.date.localeCompare(b.date)||a.slot.localeCompare(b.slot),
 group:r=>r.date===Neo.today()?'Today':r.date,
 row:(r,X)=>{const f=(X.Foods||[]).find(x=>x.name.toLowerCase()===r.food.toLowerCase());return [r.food,r.slot+(r.notes?' · '+r.notes:''),f&&f.calories?f.calories+' kcal':'']}});
</script>
</body>
</html>
