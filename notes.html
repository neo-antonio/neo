<main id="app"></main>
<script>
Neo.collection({tab:'Notes',title:'Notes',noun:'note',fields:[
 {k:'title',l:'Title',req:1},{k:'body',l:'Note',t:'textarea'},{k:'pinned',l:'Pin to top',t:'check'}],
 sort:(a,b)=>(!!b.pinned-!!a.pinned)||(b.updated||'').localeCompare(a.updated||''),
 row:r=>[(r.pinned?'📌 ':'')+r.title,(r.body||'').replace(/\s+/g,' ').slice(0,110)]});
</script>
