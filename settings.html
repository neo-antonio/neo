<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings · neo</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="neo">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="shell.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</head>
<body>
<main id="app"></main>
<script>
const N=Neo,root=document.getElementById('app');let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;document.getElementById('inst').hidden=false});
root.innerHTML='<div class="bar"><h1>Settings</h1></div><div class="panel"><h3>Connection</h3><div class="field"><label for="ep">Apps Script web app URL</label><input id="ep" placeholder="https://script.google.com/macros/s/…/exec" value="'+N.esc(N.ep())+'"></div><div class="field"><label for="sc">Secret</label><input id="sc" type="password" value="'+N.esc(N.ls('neo_sec')||'')+'" placeholder="Same as SECRET in Code.gs"></div><p class="mut" id="msg" style="margin-top:0">Saved on this device only. Leave empty to use config.js.</p><div class="acts"><button class="go" id="save">Save &amp; test</button></div></div>'
+'<div class="panel"><h3>App</h3><div class="acts"><button class="ghost" id="inst" hidden>Install neo</button><button class="ghost" id="ref">Refresh app files</button><button class="ghost" id="clr">Clear offline data</button></div></div>';
const $=id=>document.getElementById(id);
$('save').onclick=async()=>{N.ls('neo_ep',$('ep').value.trim()||null);N.ls('neo_sec',$('sc').value||null);$('msg').textContent='Testing…';try{const d=await N.api('ping');$('msg').textContent='Connected. '+d.tabs.length+' tabs ready in your sheet.'}catch(e){$('msg').textContent=e.message}};
$('inst').onclick=()=>dip&&dip.prompt();
$('ref').onclick=async()=>{for(const k of await caches.keys())await caches.delete(k);for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();location.reload()};
$('clr').onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith('neo_c_')).forEach(k=>localStorage.removeItem(k));N.toast('Offline data cleared')};
</script>
</body>
</html>
