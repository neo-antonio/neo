<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statistics · neo</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="neo">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="shell.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</head>
<body>
<main id="app"></main>
<script>
const N=Neo,root=document.getElementById('app');
const bars=(items,fmt)=>{const mx=Math.max(1,...items.map(i=>i[1]));return items.map(i=>'<div class="brow"><span>'+N.esc(i[0])+'</span><div class="prog"><i style="width:'+i[1]/mx*100+'%"></i></div><span>'+(fmt?fmt(i[1]):Math.round(i[1]))+'</span></div>').join('')||'<p class="mut">No data yet.</p>'};
const sum=(a,k)=>a.reduce((t,r)=>t+N.num(r[k]),0);
N.many(['DailyLog','Finance','Todos','Habits','HabitLog','Profile']).then(D=>{
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return N.ymd(d)});
 const cal=days.map(k=>[k.slice(5),sum(D.DailyLog.filter(r=>r.date===k),'calories')]),logged=cal.filter(c=>c[1]).length,avg=logged?Math.round(cal.reduce((t,c)=>t+c[1],0)/logged):0;
 const tgt=N.num((D.Profile[0]||{}).calorieTarget);
 const wt=D.DailyLog.filter(r=>N.num(r.weightKg)).sort((a,b)=>a.date.localeCompare(b.date)).slice(-8);
 const mo=N.today().slice(0,7),ex=D.Finance.filter(r=>r.type==='expense'&&r.date.slice(0,7)===mo),by={};ex.forEach(r=>by[r.category||'Other']=(by[r.category||'Other']||0)+N.num(r.amount));
 const done=D.Todos.filter(t=>t.status==='done').length,hp=D.Habits.length?Math.round(D.HabitLog.filter(l=>days.includes(l.date)&&D.Habits.some(h=>h.id===l.habit)).length/(D.Habits.length*7)*100):0;
 root.innerHTML='<div class="bar"><h1>Statistics</h1></div><div class="cards"><div class="card"><span class="l">Avg calories (logged days)</span><span class="n">'+avg+'</span>'+(tgt?'<small>target '+tgt+'</small>':'')+'</div><div class="card"><span class="l">Latest weight</span><span class="n">'+(wt.length?wt[wt.length-1].weightKg+' kg':'—')+'</span>'+(wt.length>1?'<small>'+((wt[wt.length-1].weightKg-wt[0].weightKg)>0?'+':'')+(wt[wt.length-1].weightKg-wt[0].weightKg).toFixed(1)+' kg since '+wt[0].date+'</small>':'')+'</div><div class="card"><span class="l">Habits, last 7 days</span><span class="n">'+hp+'%</span></div><div class="card"><span class="l">Tasks done</span><span class="n">'+done+'/'+D.Todos.length+'</span></div></div>'
 +'<div class="panel"><h3>Calories, last 7 days</h3>'+bars(cal)+'</div>'
 +'<div class="panel"><h3>Weight (kg)</h3>'+bars(wt.map(r=>[r.date.slice(5),N.num(r.weightKg)]),v=>v.toFixed(1))+'</div>'
 +'<div class="panel"><h3>Spending this month</h3>'+bars(Object.entries(by).sort((a,b)=>b[1]-a[1]),v=>N.money(v).replace(/\.00$/,''))+'</div>'
}).catch(e=>root.innerHTML='<p class="err">'+N.esc(e.message)+'</p>');
</script>
</body>
</html>
