<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-do List · neo</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="neo">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="shell.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</head>
<body>
<main id="app"></main>
<script>
Neo.collection({tab:'Todos',title:'To-do List',noun:'task',toggle:{k:'status',on:'done',off:'open'},fields:[
 {k:'title',l:'Task',req:1},{k:'due',l:'Due',t:'date'},{k:'priority',l:'Priority',t:'select',opt:['Normal','High','Low']},
 {k:'status',l:'Status',t:'select',opt:['open','done']},{k:'notes',l:'Notes',t:'textarea'}],
 sort:(a,b)=>(a.status==='done')-(b.status==='done')||(a.due||'9').localeCompare(b.due||'9'),
 row:r=>[r.title,[r.due&&(r.due<Neo.today()&&r.status!=='done'?'Overdue · ':'')+r.due,r.notes].filter(Boolean).join(' · '),r.priority==='High'?'High':'']});
</script>
</body>
</html>
