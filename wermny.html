<!-- wermny: header + tabs, pages, dialogs. Injected into #host-wm by app.js; styled by the .wm rules in styles.css. -->
<div class="top" id="wmTop" hidden>
  <div class="hbar"><a class="back" href="#/home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><h2 id="wmTitle">Transactions</h2><div class="wm"><button id="currencyBtn" class="currency-btn" type="button" aria-haspopup="dialog">
      <span id="currencyBtnLabel">₱ PHP</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M6 9l6 6 6-6"></path></svg>
    </button></div></div>
  <div class="tabs tabs-3" id="wmTabs"><button type="button" class="tab active" data-r="transactions">Transactions</button><button type="button" class="tab" data-r="accounts">Accounts</button><button type="button" class="tab" data-r="more">More</button></div>
</div>

<main class="launcher es-main" id="view-wm" hidden><div class="wm">

    <!-- TRANSACTIONS TAB -->
    <section id="view-transactions" class="tab-view is-active">
      <div class="stat-card stat-networth-full">
        <span class="stat-label">Net worth</span>
        <span class="stat-value" id="statNetWorth">₱0.00</span>
      </div>
      <div class="stats-grid">
        <button type="button" class="stat-card stat-receivable" id="statReceivableBtn">
          <span class="stat-label">Receivables</span>
          <span class="stat-value" id="statReceivable">₱0.00</span>
        </button>
        <button type="button" class="stat-card stat-debt" id="statDebtBtn">
          <span class="stat-label">Debt</span>
          <span class="stat-value" id="statDebt">₱0.00</span>
        </button>
        <div class="stat-card stat-inflow">
          <span class="stat-label">Inflow</span>
          <span class="stat-value" id="statInflow">₱0.00</span>
        </div>
        <div class="stat-card stat-outflow">
          <span class="stat-label">Outflow</span>
          <span class="stat-value" id="statOutflow">₱0.00</span>
        </div>
      </div>

      <div class="section-toolbar">
        <h1 class="section-title">Transactions</h1>
        <div class="toolbar-actions">
          <button id="txSearchBtn" class="filter-btn icon-only" type="button" aria-label="Search transactions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
          </button>
          <button id="txFilterBtn" class="filter-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
            <span id="txFilterLabel">This month</span>
          </button>
        </div>
      </div>

      <div id="txList" class="tx-list"></div>

      <div id="txEmpty" class="empty-state" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M3 10h18M8 4v4"></path></svg>
        <p>No transactions in this range yet.</p>
      </div>

      <button id="txSeeMoreBtn" class="see-more-btn" type="button" hidden>See more</button>
    </section>

    <!-- ACCOUNTS TAB -->
    <section id="view-accounts" class="tab-view">
      <div class="section-toolbar">
        <h1 class="section-title">Accounts</h1>
        <div class="toolbar-actions">
          <span class="section-sub" id="accountsTotal">₱0.00 total</span>
          <button id="accountsSortBtn" class="filter-btn icon-only" type="button" aria-label="Sort accounts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M7 4v16M7 4l-3 3M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"></path></svg>
          </button>
        </div>
      </div>

      <div id="accountsList" class="accounts-list"></div>

      <div id="accountsEmpty" class="empty-state" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>
        <p>Add an account to start tracking balances.</p>
      </div>
    </section>

    <!-- MORE TAB -->
    <section id="view-more" class="tab-view">
      <div class="more-subnav" id="moreSubnav">
        <button class="more-subnav-btn is-active" data-sub="profile" type="button">Profile</button>
        <button class="more-subnav-btn" data-sub="categories" type="button">Categories</button>
        <button class="more-subnav-btn" data-sub="statistics" type="button">Statistics</button>
        <button class="more-subnav-btn" data-sub="settings" type="button">Settings</button>
      </div>

      <!-- Profile -->
      <div id="sub-profile" class="sub-view is-active">
        <div class="profile-card">
          <button type="button" class="profile-avatar" id="profileAvatarBtn" aria-label="Change profile picture">
            <span id="profileAvatarInitial">W</span>
          </button>
          <button type="button" class="profile-photo-link" id="profileAvatarEditBtn">Change photo</button>
          <div class="profile-field-group">
            <label class="field-label" for="profileNameInput">Display name</label>
            <input id="profileNameInput" class="text-input" type="text" placeholder="Your name" maxlength="40">
          </div>
          <p class="profile-meta" id="profileMemberSince">Member since -</p>
        </div>
      </div>

      <!-- Categories -->
      <div id="sub-categories" class="sub-view">
        <div class="section-toolbar">
          <h2 class="section-title">Categories</h2>
          <button id="addCategoryBtn" class="filter-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M12 5v14M5 12h14"></path></svg>
            <span>Category</span>
          </button>
        </div>
        <div id="categoriesList" class="categories-list"></div>
      </div>

      <!-- Statistics -->
      <div id="sub-statistics" class="sub-view">
        <div class="section-toolbar">
          <h2 class="section-title">Statistics</h2>
          <div class="toolbar-actions">
            <button id="statsCategoryFilterBtn" class="filter-btn icon-only" type="button" aria-label="Filter categories">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M4 5h16l-6 7.5V19l-4 2v-8.5L4 5z"></path></svg>
            </button>
            <button id="statsFilterBtn" class="filter-btn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
              <span id="statsFilterLabel">This month</span>
            </button>
          </div>
        </div>

        <div class="stats-type-toggle" id="statsTypeToggle">
          <button class="toggle-pill is-active" data-type="expense" type="button">Expense</button>
          <button class="toggle-pill" data-type="income" type="button">Income</button>
        </div>

        <div class="chart-card">
          <div id="pieChartWrap" class="pie-chart-wrap"></div>
          <div id="statsEmpty" class="empty-state" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
            <p>Nothing to show for this range.</p>
          </div>
          <div id="pieLegend" class="pie-legend"></div>
        </div>
      </div>

      <!-- Settings -->
      <div id="sub-settings" class="sub-view">
        <h2 class="section-title">Settings</h2>
        <div class="settings-list">
          <button class="settings-row" id="settingsCurrencyRow" type="button">
            <span>Default currency</span>
            <span class="settings-row-value" id="settingsCurrencyValue">PHP</span>
          </button>
          <button class="settings-row" id="settingsPaletteRow" type="button">
            <span>Color palette</span>
            <span class="settings-row-value settings-row-swatch">
              <span id="settingsPaletteDot" class="palette-dot"></span>
              <span id="settingsPaletteValue">Light Purple</span>
            </span>
          </button>
          <button class="settings-row settings-row-danger" id="resetDataBtn" type="button">
            <span>Reset all data</span>
          </button>
        </div>
      </div>
    </section>

  </div></main>

<div class="wm" id="wmOverlays"><button id="fabBtn" hidden class="fab" type="button" aria-label="Add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
  </button>
<!-- Centered modal overlay -->
<div id="modalOverlay" class="overlay" hidden>
  <div class="wm-modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modalTitle" class="modal-title"></h2>
      <button id="modalCloseBtn" class="wm-icon-btn" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<!-- Bottom sheet overlay -->
<div id="sheetOverlay" class="overlay" hidden>
  <div class="wm-sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <h2 id="sheetTitle" class="sheet-title"></h2>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="wm-toast" hidden></div>

<!-- Hidden shared file input for image picking (gallery / files) -->
<input type="file" id="globalImageFileInput" accept="image/*" hidden>

</div>
